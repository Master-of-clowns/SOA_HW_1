name: flight-booking
x-postgres: &postgres
  image: postgres:16-alpine
  environment:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: ${DB_PASSWORD:-local-demo-password}
    POSTGRES_DB: app
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U app -d app"]
    interval: 2s
    timeout: 2s
    retries: 30
x-migration: &migration
  image: flight-booking-migrations
  build:
    context: .
    target: migrations
x-sentinel: &sentinel
  image: flight-booking-sentinel
  build:
    context: .
    target: sentinel
  depends_on:
    redis-replica:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "redis-cli", "-p", "26379", "ping"]
    interval: 2s
    timeout: 2s
    retries: 30
x-rpc: &rpc
  GRPC_API_KEY: ${GRPC_API_KEY:-local-demo-service-key}
  GRPC_TIMEOUT: ${GRPC_TIMEOUT:-1}
  CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD:-5}
  CB_RESET_SECONDS: ${CB_RESET_SECONDS:-10}
  CB_WINDOW_SECONDS: ${CB_WINDOW_SECONDS:-60}
services:
  flight-db:
    <<: *postgres
    volumes: [flight-data:/var/lib/postgresql/data]
  booking-db:
    <<: *postgres
    volumes: [booking-data:/var/lib/postgresql/data]
  flight-migrate:
    <<: *migration
    depends_on:
      flight-db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://flight-db:5432/app
      FLYWAY_USER: app
      FLYWAY_PASSWORD: ${DB_PASSWORD:-local-demo-password}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql/flight
    command: migrate
  booking-migrate:
    <<: *migration
    depends_on:
      booking-db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://booking-db:5432/app
      FLYWAY_USER: app
      FLYWAY_PASSWORD: ${DB_PASSWORD:-local-demo-password}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql/booking
    command: migrate
  redis-master:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --replica-announce-ip, redis-master]
    volumes: [redis-master-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis-replica:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --replicaof, redis-master, '6379', --replica-announce-ip, redis-replica]
    volumes: [redis-replica-data:/data]
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  sentinel-1:
    <<: *sentinel
  sentinel-2:
    <<: *sentinel
  sentinel-3:
    <<: *sentinel
  flight:
    image: flight-booking-app
    build:
      context: .
      target: app
    command: python flight.py
    environment:
      <<: *rpc
      DATABASE_URL: postgresql://app:${DB_PASSWORD:-local-demo-password}@flight-db:5432/app
      REDIS_SENTINELS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      CACHE_TTL: '300'
    depends_on:
      flight-migrate:
        condition: service_completed_successfully
      sentinel-1:
        condition: service_healthy
      sentinel-2:
        condition: service_healthy
      sentinel-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.channel_ready_future(grpc.insecure_channel('localhost:50051')).result(timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
  booking:
    image: flight-booking-app
    build:
      context: .
      target: app
    environment:
      <<: *rpc
      DATABASE_URL: postgresql://app:${DB_PASSWORD:-local-demo-password}@booking-db:5432/app
      FLIGHT_ADDRESS: flight:50051
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      booking-migrate:
        condition: service_completed_successfully
      flight:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  flight-data:
  booking-data:
  redis-master-data:
  redis-replica-data:
